# Used only by the independent portfolio site, with its base directory set to
# portfolio in Netlify. The repository-root config continues to build Astro.
[build]
  base = "portfolio"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  BLOCK_SEARCH_INDEXING = "true"

# Explicitly install the current adapter for this API-provisioned monorepo site.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
