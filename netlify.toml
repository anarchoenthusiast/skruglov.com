[build]
  command = "npm run build:netlify"
  publish = "dist"
 
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--production=false --include=optional"
  SHARP_IGNORE_GLOBAL_LIBVIPS = "1"
  SHARP_FORCE_REBUILD = "true"
  NPM_CONFIG_OPTIONAL = "true"

# Настройки для функций (если понадобятся в будущем)
[functions]
  node_bundler = "esbuild"

# Hashed build assets can be cached forever. HTML stays revalidated.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/projects/*/cover.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
 